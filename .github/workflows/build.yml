name: My-one-apk

on:
  # push:
  #   branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/gradle-build-action@v3

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug

      - name: List build outputs
        run: |
          echo "=== Структура app/build/ ==="
          ls -R app/build/
          echo "=== Поиск APK ==="
          find app/build -name "*.apk"

      - name: Copy APK to repo folder
        run: |
          mkdir -p app/build/outputs/apk/debug/
          mkdir -p apk
          cp app/build/outputs/apk/debug/app-debug.apk apk/app.apk

      - name: Push APK to repository
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Update APK"
          file_pattern: "apk/*.apk"
          skip_fetch: true

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk