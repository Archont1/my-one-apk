# Имя рабочего процесса 
name: My-one-apk 

# Условия запуска:
on:
  push:
    branches: [ main ]    # Автоматически при пуше в ветку main
  workflow_dispatch:      # Можно запустить вручную из веб-интерфейса

# Задачи, которые выполняются
jobs:
  build:                  # Имя задачи 
    runs-on: ubuntu-latest   # Виртуальная машина

    # Шаги внутри задачи
    steps:
      - name: Checkout code   # Загрузить код из репозитория
        uses: actions/checkout@v4

      - name: Set up JDK 17   # Установить Java 17
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'   # Дистрибутив OpenJDK
          java-version: '17'

      - name: Setup Gradle   # Подготовить Gradle (кеширование зависимостей)
        uses: gradle/gradle-build-action@v3

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build debug APK   # Собрать отладочную версию APK
        run: ./gradlew assembleDebug   # Команда Gradle для сборки

      - name: Upload APK      # Загрузить готовый APK как артефакт
        uses: actions/upload-artifact@v4
        with:
          name: app-debug     # Имя архива для скачивания
          path: app/build/outputs/apk/debug/app-debug.apk   # Путь к собранному файлу